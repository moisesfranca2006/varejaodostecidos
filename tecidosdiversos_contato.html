        <main class="container m-2 w-75 mx-auto minha-fonte">

            <div class="row">
                <div class="col text-center m-0">
                    <h2 class="mt-2 mb-0 my-h2">Fale conosco</h2>
                </div>
            </div>

            <form name="frmContato" id="idFrmContato" action="#"
                method="post" class="my-label-color-purple">

                <div class="form-row mt-4">
                    <div class="form-group col-md-6">
                        <label for="idNome">Nome</label>
                        <input type="text" name="nome" id="idNome"
                            maxlength="70" placeholder="Informe o seu nome"
                            class="form-control">
                    </div>
                    <div class="form-group col-md-6">
                        <label for="idUltimoNome">Último Nome</label>
                        <input type="text" name="ultimoNome"
                            id="idUltimoNome"
                            maxlength="70"
                            placeholder="Informe o seu último nome"
                            class="form-control">
                    </div>
                </div>

                <div class="form-group">
                    <label for="idEmail">E-mail</label>
                    <input type="email" name="email" id="idEmail"
                        maxlength="100" placeholder="Informe o seu E-mail"
                        class="form-control">
                </div>

                <div class="form-group">
                    <label for="idTelefone">Telefone</label>
                    <input type="tel" name="telefone" id="idTelefone"
                        placeholder="Informe o seu Telefone"
                        class="form-control"
                        pattern="(\(?[0-9]{2}\)?\s)?([0-9]{4}\-[0-9]{4})">
                </div>

                <fieldset class="form-group">

                    <div class="row">

                        <legend class="col-form-label pt-0 col-md-2">Gênero</legend>

                        <div class="col-md-10">
                            <div class="form-check form-check-inline">
                                <input type="radio" name="genero" value="F"
                                    id="idGeneroF" class="form-check-input">
                                <label for="idGeneroF" class="form-check-label">Feminino</label>
                            </div>

                            <div class="form-check form-check-inline">
                                <input type="radio" name="genero" value="M"
                                    id="idGeneroM" class="form-check-input">
                                <label for="idGeneroM" class="form-check-label">Masculino</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input type="radio" name="genero" value="O"
                                    id="idGeneroO" class="form-check-input">
                                <label for="idGeneroO" class="form-check-label">Outros</label>
                            </div>
                        </div>

                    </div>
                </fieldset>

                <div class="form-group">
                    <label for="idAssunto">Assunto</label>
                    <select id="idAssunto" name="assunto" class="form-control">
                        <option value="0" selected>Selecione...</option>
                        <option value="E">Elogio</option>
                        <option value="C">Crítica</option>
                        <option value="S">Solicitação</option>
                        <option value="O">Outros</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="idMensagem">Mensagem</label>
                    <textarea rows="10" cols="200" id="idMensagem"
                        name="mensagem"
                        placeholder="Preencha com a mensagem desejada"
                        class="form-control">
                    </textarea>
                </div>

                <div class="form-group">
                    <label>Arquivo</label>
                    <div class="custom-file">
                        <input class="custom-file-input" type="file"
                            id="idArquivo" name="arquivo">
                        <label class="custom-file-label" for="idArquivo">Escolha
                            o arquivo a enviar</label>
                    </div>
                </div>

                <div class="form-group text-center">
                    <input type="reset" value="Limpar"
                        class="btn btn-primary btn-md">
                    <input type="submit" value="Enviar"
                        class="btn btn-primary btn-md">
                </div>

            </form>

        </main>
